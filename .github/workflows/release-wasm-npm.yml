# Publish `axiam-sdk-wasm` to npm.
#
# Separate from `sdk-ci-rust.yml` on purpose: that workflow publishes two crates
# to crates.io on the same tag, and a failure in one publisher must not take the
# other down with it. Both are gated on the same `verify-tag-on-main` idea, and
# both are tag-triggered only, so no PR ever sees a publishing credential.
#
# ─────────────────────────────────────────────────────────────────────────────
# AUTHENTICATION — READ BEFORE THE FIRST PUBLISH
#
# This workflow is written for the token path, because Trusted Publishing
# cannot be configured for a package that does not exist yet: npm needs the
# package present before you can attach a trusted publisher to it. So:
#
#   FIRST PUBLISH  — set the `NPM_TOKEN` repository secret to an npm
#                    **automation** token with publish rights. That is the only
#                    secret this workflow needs.
#
#   AFTER THAT     — configure Trusted Publishing on npmjs.com for
#                    `axiam-sdk-wasm`, pointing at this repository and
#                    `.github/workflows/release-wasm-npm.yml`, then switch this
#                    workflow over by making exactly three edits, all marked
#                    `# [TRUSTED PUBLISHING]` below:
#
#                      1. add `environment:` to this job if the npm
#                         configuration names one (it will fail otherwise —
#                         the OIDC claim has to match);
#                      2. delete the `NODE_AUTH_TOKEN` env block;
#                      3. keep the npm upgrade step — Trusted Publishing needs
#                         npm >= 11.5.1, and `setup-node` with Node 22 ships
#                         npm 10.x, so without it TP silently does not engage
#                         and the publish falls back to looking for a token
#                         that is no longer there.
#
# `id-token: write` is already granted: provenance needs it on both paths.
# ─────────────────────────────────────────────────────────────────────────────

name: Release — axiam-sdk-wasm to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # A tag can be pushed to any commit. Publishing to npm is irreversible — a
  # version number can never be reclaimed — so refuse to publish anything that
  # is not on main.
  verify-tag-on-main:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Assert the tagged commit is an ancestor of origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is NOT on origin/main."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is on origin/main."

  publish:
    name: Publish to npm
    needs: verify-tag-on-main
    runs-on: ubuntu-latest
    # [TRUSTED PUBLISHING] 1/3 — uncomment and set to the environment named in
    # the npm trusted-publisher configuration. Leaving this out when npm expects
    # an environment fails the publish with an opaque OIDC mismatch.
    # environment: npm-publish
    permissions:
      contents: read
      id-token: write   # npm provenance (and Trusted Publishing) OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (2026-03-27)
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # [TRUSTED PUBLISHING] 3/3 — required for TP (needs npm >= 11.5.1) and
      # harmless on the token path. Node 22 ships npm 10.x, which does not know
      # about Trusted Publishing at all and would quietly look for a token.
      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      # Which credential will npm ACTUALLY use? Answer it here, in two seconds,
      # rather than after a wasm toolchain install, two release builds and a
      # smoke test — and answer it without printing the secret.
      #
      # This package matters more than most for that question: `axiam-sdk-wasm`
      # does not exist on npm yet, and npm cannot attach a trusted publisher to
      # a package that does not exist. So the FIRST publish has to be by token,
      # no matter what the header above plans for afterwards. If NPM_TOKEN is
      # missing here, no amount of Trusted Publishing configuration will help
      # and the job should say so before it spends five minutes building.
      - name: Report which npm credential this job will use
        env:
          NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "npm version:       $(npm --version)"
          echo "package:           axiam-sdk-wasm"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token:        available"
          else
            echo "OIDC token:        NOT available (id-token: write missing?)"
          fi
          echo "NPM_TOKEN secret:  ${NPM_TOKEN_PRESENT}"
          if [ "${NPM_TOKEN_PRESENT}" = "true" ]; then
            echo "==> This job will authenticate with the NPM_TOKEN secret."
            echo "    Correct for a first publish: Trusted Publishing cannot be"
            echo "    configured for a package that does not exist on npm yet."
          else
            echo "::error::NPM_TOKEN is not set in this repository."
            echo "::error::axiam-sdk-wasm has never been published, so npm has no"
            echo "::error::package to attach a trusted publisher to — the first"
            echo "::error::publish MUST use an npm automation token. Set the"
            echo "::error::NPM_TOKEN repository secret and re-run this release."
            exit 1
          fi

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa  # v0.4.0
        with:
          version: 'v0.15.0'

      # A tag can outlive a forgotten version bump, and npm refuses a
      # re-published version — so assert agreement BEFORE any side effect
      # rather than discovering it half way through.
      - name: Verify tag matches the crate version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(grep -m1 '^version' axiam-sdk-wasm/Cargo.toml | cut -d'"' -f2)"
          if [ "${tag_version}" != "${crate_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies ${tag_version}, but axiam-sdk-wasm/Cargo.toml says ${crate_version}."
            exit 1
          fi
          echo "OK: tag ${GITHUB_REF_NAME} matches ${crate_version}."

          # npm >= 11 refuses to publish a prerelease without an explicit
          # --tag, and it is right to: without one the release would land on
          # `latest`, so a plain `npm install axiam-sdk-wasm` would hand every
          # consumer an alpha. Derive the dist-tag from the version instead of
          # hard-coding it, so the same workflow serves 1.0.0-alpha30 (alpha),
          # 1.0.0-rc.1 (rc) and 1.0.0 (latest) with no edit.
          case "${tag_version}" in
            *-*)
              pre="${tag_version#*-}"     # 1.0.0-alpha30 -> alpha30, 1.0.0-rc.1 -> rc.1
              pre="${pre%%.*}"            # rc.1 -> rc
              dist_tag="$(printf '%s' "${pre}" | sed 's/[0-9]*$//')"   # alpha30 -> alpha
              # A purely numeric prerelease (1.0.0-30) leaves nothing behind;
              # `next` keeps it off `latest`, which is the property that matters.
              [ -n "${dist_tag}" ] || dist_tag="next"
              ;;
            *)
              dist_tag="latest"
              ;;
          esac
          echo "NPM_DIST_TAG=${dist_tag}" >> "${GITHUB_ENV}"
          echo "npm dist-tag: ${dist_tag}"

      # `--target bundler` is what npm consumers get: webpack, Vite, Rollup and
      # esbuild all understand it, and it is the only target that works as a
      # plain `import` without a manual `init()` call in a bundled app.
      # Consumers who need `web` or `nodejs` build from source; publishing three
      # entry points from one package name would need a hand-written
      # package.json that wasm-pack does not generate.
      - name: Build the npm package
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        working-directory: axiam-sdk-wasm
        run: wasm-pack build --target bundler --out-dir pkg --release

      # The nodejs target exists solely so the smoke test can `require` it.
      # Publishing an artifact nobody has imported is how a broken wasm-opt
      # reaches a CDN — see axiam-sdk-wasm/Cargo.toml.
      - name: Smoke-test the artifact before publishing
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        working-directory: axiam-sdk-wasm
        run: |
          wasm-pack build --target nodejs --out-dir pkg-node --release
          node scripts/wasm-smoke.mjs pkg-node

      - name: Copy LICENSE and README into the package
        working-directory: axiam-sdk-wasm
        run: cp ../LICENSE pkg/LICENSE && cp README.md pkg/README.md

      - name: Verify the tarball before publishing
        working-directory: axiam-sdk-wasm/pkg
        run: npm publish --dry-run --tag "${NPM_DIST_TAG}"

      - name: Publish to npm with provenance
        working-directory: axiam-sdk-wasm/pkg
        # [TRUSTED PUBLISHING] 2/3 — delete this `env:` block once Trusted
        # Publishing is configured. A token present takes precedence over OIDC,
        # so leaving it would mean TP is configured and never used.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag "${NPM_DIST_TAG}"
