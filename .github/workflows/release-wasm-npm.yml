# Publish `axiam-sdk-wasm` to npm.
#
# Separate from `sdk-ci-rust.yml` on purpose: that workflow publishes two crates
# to crates.io on the same tag, and a failure in one publisher must not take the
# other down with it. Both are gated on the same `verify-tag-on-main` idea, and
# both are tag-triggered only, so no PR ever sees a publishing credential.
#
# ─────────────────────────────────────────────────────────────────────────────
# AUTHENTICATION — Trusted Publishing (OIDC), no token
#
# npm authenticates this workflow by its OIDC identity: the repository, the
# workflow file path and the environment below are matched against the trusted
# publisher configured on npmjs.com for `axiam-sdk-wasm`. There is no
# `NPM_TOKEN` and there should not be — a token present takes precedence over
# OIDC, so leaving one configured would mean Trusted Publishing is set up and
# silently never used.
#
# Three things have to stay true or the publish fails, usually with an OIDC
# mismatch that does not say which one:
#
#   1. `id-token: write` on this job. Without it there is no OIDC token to
#      present, and npm falls back to looking for a credential that is not
#      there.
#   2. `environment: production` matches the environment named in npm's trusted
#      publisher configuration. If npm names one and this omits it — or names a
#      different one — the claim does not match.
#   3. npm >= 11.5.1. `setup-node` with Node 22 ships npm 10.x, which does not
#      know about Trusted Publishing at all, so the upgrade step below is
#      load-bearing rather than hygiene.
#
# Renaming or moving this file breaks the trust relationship: the workflow path
# is part of what npm matches. Update the publisher on npmjs.com first.
#
# Provenance is automatic under Trusted Publishing, so `--provenance` is no
# longer passed explicitly.
# ─────────────────────────────────────────────────────────────────────────────

name: Release — axiam-sdk-wasm to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # A tag can be pushed to any commit. Publishing to npm is irreversible — a
  # version number can never be reclaimed — so refuse to publish anything that
  # is not on main.
  verify-tag-on-main:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Assert the tagged commit is an ancestor of origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is NOT on origin/main."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is on origin/main."

  publish:
    name: Publish to npm
    needs: verify-tag-on-main
    runs-on: ubuntu-latest
    # Must match the environment named in npm's trusted-publisher configuration
    # for this package. Omitting it, or naming a different one, fails the
    # publish with an OIDC claim mismatch that does not say so.
    environment: production
    permissions:
      contents: read
      id-token: write   # Trusted Publishing OIDC (and provenance, which it implies)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable (2026-03-27)
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Load-bearing, not hygiene: Trusted Publishing needs npm >= 11.5.1, and
      # `setup-node` with Node 22 ships npm 10.x, which does not know about it
      # at all and would quietly look for a token that is not there.
      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      # Which credential will npm ACTUALLY use? Answer it here, in two
      # seconds, rather than after a wasm toolchain install, two release builds
      # and a smoke test.
      #
      # The failure this catches is specific and quiet: a leftover NPM_TOKEN
      # secret takes precedence over OIDC, so Trusted Publishing would be
      # configured, believed to be in use, and never actually used. Refusing
      # here is better than a green publish that did not do what the repository
      # says it does.
      - name: Assert Trusted Publishing will be used
        env:
          NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "npm version: $(npm --version)"
          echo "package:     axiam-sdk-wasm"

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token available. This job needs \`id-token: write\`;"
            echo "::error::without it npm cannot use Trusted Publishing."
            exit 1
          fi
          echo "OIDC token:  available"

          if [ "${NPM_TOKEN_PRESENT}" = "true" ]; then
            echo "::error::The NPM_TOKEN secret is still set. npm prefers a token over"
            echo "::error::OIDC, so this publish would silently bypass Trusted"
            echo "::error::Publishing. Delete the NPM_TOKEN repository secret."
            exit 1
          fi
          echo "NPM_TOKEN:   absent (correct — OIDC will be used)"

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa  # v0.4.0
        with:
          version: 'v0.15.0'

      # A tag can outlive a forgotten version bump, and npm refuses a
      # re-published version — so assert agreement BEFORE any side effect
      # rather than discovering it half way through.
      - name: Verify tag matches the crate version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(grep -m1 '^version' axiam-sdk-wasm/Cargo.toml | cut -d'"' -f2)"
          if [ "${tag_version}" != "${crate_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies ${tag_version}, but axiam-sdk-wasm/Cargo.toml says ${crate_version}."
            exit 1
          fi
          echo "OK: tag ${GITHUB_REF_NAME} matches ${crate_version}."

          # npm >= 11 refuses to publish a prerelease without an explicit
          # --tag, and it is right to: without one the release would land on
          # `latest`, so a plain `npm install axiam-sdk-wasm` would hand every
          # consumer an alpha. Derive the dist-tag from the version instead of
          # hard-coding it, so the same workflow serves 1.0.0-alpha30 (alpha),
          # 1.0.0-rc.1 (rc) and 1.0.0 (latest) with no edit.
          case "${tag_version}" in
            *-*)
              pre="${tag_version#*-}"     # 1.0.0-alpha30 -> alpha30, 1.0.0-rc.1 -> rc.1
              pre="${pre%%.*}"            # rc.1 -> rc
              dist_tag="$(printf '%s' "${pre}" | sed 's/[0-9]*$//')"   # alpha30 -> alpha
              # A purely numeric prerelease (1.0.0-30) leaves nothing behind;
              # `next` keeps it off `latest`, which is the property that matters.
              [ -n "${dist_tag}" ] || dist_tag="next"
              ;;
            *)
              dist_tag="latest"
              ;;
          esac

          # ...with one exception, which holds only while this package has no
          # stable release at all.
          #
          # npmjs.com renders the README of whatever version `latest` names,
          # and a plain `npm install axiam-sdk-wasm` resolves to it. The first
          # publish put `latest` on 1.0.0-alpha31 and nothing has moved it
          # since, so the package page kept serving that release's README —
          # still documenting SRP long after SRP was removed from AXIAM —
          # while every alpha after it shipped to a channel tag nobody reads.
          # Keeping `latest` off a prerelease protects a stable release; there
          # is no stable release here to protect, and pointing `latest` at a
          # five-versions-old alpha is not the safer default, only the older
          # one.
          #
          # This has to be decided here, at publish time. Only `npm publish`
          # performs the OIDC token exchange — npm/cli calls
          # `lib/utils/oidc.js` from `lib/commands/publish.js` and nowhere
          # else — so a follow-up `npm dist-tag add` would need the NPM_TOKEN
          # this workflow deliberately refuses to have.
          #
          # The moment 1.0.0 is published the condition stops holding and
          # every prerelease after it goes to its own channel again.
          #
          # The cost, stated plainly: the channel tag (`alpha`) does not
          # advance while this branch is taken, so `@alpha` keeps naming
          # whichever prerelease last used it. `latest` is the tag that
          # consumers and the package page actually read.
          if [ "${dist_tag}" != "latest" ]; then
            # `|| true`, and a separate step from the parse: `npm view` exits
            # non-zero for a package with no published versions, and under
            # `set -o pipefail` that would abort the release rather than
            # answer "no stable version" — which is the answer.
            versions_json="$(npm view axiam-sdk-wasm versions --json 2>/dev/null || true)"
            stable_count="$(printf '%s' "${versions_json}" | node -e '
              let s = "";
              process.stdin.on("data", d => s += d).on("end", () => {
                let v = [];
                try { v = JSON.parse(s); } catch {}
                if (!Array.isArray(v)) { v = v ? [v] : []; }
                process.stdout.write(String(v.filter(x => !x.includes("-")).length));
              });
            ')"
            if [ "${stable_count}" = "0" ]; then
              echo "No stable version is published, so \`latest\` would otherwise stay on an old prerelease."
              echo "Publishing ${tag_version} to \`latest\` instead of \`${dist_tag}\`."
              dist_tag="latest"
            else
              echo "${stable_count} stable version(s) published; leaving \`latest\` alone."
            fi
          fi

          echo "NPM_DIST_TAG=${dist_tag}" >> "${GITHUB_ENV}"
          echo "npm dist-tag: ${dist_tag}"

      # `--target bundler` is what npm consumers get: webpack, Vite, Rollup and
      # esbuild all understand it, and it is the only target that works as a
      # plain `import` without a manual `init()` call in a bundled app.
      # Consumers who need `web` or `nodejs` build from source; publishing three
      # entry points from one package name would need a hand-written
      # package.json that wasm-pack does not generate.
      - name: Build the npm package
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        working-directory: axiam-sdk-wasm
        run: wasm-pack build --target bundler --out-dir pkg --release

      # The nodejs target exists solely so the smoke test can `require` it.
      # Publishing an artifact nobody has imported is how a broken wasm-opt
      # reaches a CDN — see axiam-sdk-wasm/Cargo.toml.
      - name: Smoke-test the artifact before publishing
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        working-directory: axiam-sdk-wasm
        run: |
          wasm-pack build --target nodejs --out-dir pkg-node --release
          node scripts/wasm-smoke.mjs pkg-node

      - name: Copy LICENSE and README into the package
        working-directory: axiam-sdk-wasm
        run: cp ../LICENSE pkg/LICENSE && cp README.md pkg/README.md

      - name: Verify the tarball before publishing
        working-directory: axiam-sdk-wasm/pkg
        run: npm publish --dry-run --tag "${NPM_DIST_TAG}"

      # No NODE_AUTH_TOKEN: npm authenticates by OIDC. Provenance is implied by
      # Trusted Publishing, so `--provenance` is not passed — npm rejects it as
      # redundant on this path in some versions and attaches the attestation
      # either way.
      - name: Publish to npm
        working-directory: axiam-sdk-wasm/pkg
        run: npm publish --access public --tag "${NPM_DIST_TAG}"
