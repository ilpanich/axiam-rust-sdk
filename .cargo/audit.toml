[advisories]
# RUSTSEC-2023-0071 — Marvin attack (`rsa` private-key timing sidechannel); no
# upstream fix. `rsa` is pulled in transitively by jsonwebtoken's `rust_crypto`
# backend. No RSA private-key operation goes through it: the SDK's only RSA
# signing, the CIBA PS256 signed request (src/oidc/ciba.rs), is signed by
# `ring`, including its construction-time probe. jsonwebtoken still uses `rsa`
# to VERIFY PS256/RS256 signatures, which are public-key operations, outside the
# advisory's private-key timing leak. Review by 2026-12-23.
ignore = ["RUSTSEC-2023-0071"]

# only fail on vulnerabilities, not unmaintained/unsound warnings
informational_warnings = ["unmaintained"]

# ignore by severity threshold instead of ID
severity_threshold = "medium"
