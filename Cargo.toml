# Workspace root: this crate lives at the root of its own repository
# (github.com/ilpanich/axiam-rust-sdk). The explicit [workspace] table also
# stops Cargo from discovering an ancestor workspace if the repo is ever
# checked out inside one. The root package (`axiam-sdk`) is always a member;
# `members` additionally pulls in the proc-macro companion crate, which cannot
# live in a normal library crate (§11 declarative authorization helpers).
[workspace]
members = ["axiam-sdk-macros", "vendor/axiam-opaque"]
# `axiam-sdk-wasm` lives in this directory but is deliberately NOT a member: it
# only ever builds for `wasm32-unknown-unknown`, and a plain `cargo test` at the
# root would otherwise try to compile `wasm-bindgen` for the host and fail.
# `wasm-pack` is pointed at the directory instead. Excluding it also keeps it
# out of `cargo publish`'s file set for the root crate.
exclude = ["axiam-sdk-wasm"]
resolver = "2"

[package]
name = "axiam-sdk"
version = "1.0.0-alpha31"
edition = "2024"
rust-version = "1.88"
description = "Official Rust client SDK for AXIAM IAM"
license = "Apache-2.0"
publish = true
repository = "https://github.com/ilpanich/axiam-rust-sdk"
homepage = "https://github.com/ilpanich/axiam-rust-sdk"
documentation = "https://docs.rs/axiam-sdk"
readme = "README.md"
keywords = ["iam", "authorization", "oauth2", "rbac", "sdk"]
categories = ["api-bindings", "authentication"]
# `cargo package`/`cargo publish` follow this `include` list, NOT `.gitignore`
# — the default (VCS-only) file set would otherwise exclude `src/gen/**`,
# since it is gitignored (D-09: generated gRPC stubs are never committed).
# Publishing always happens from a worktree that regenerates `src/gen/` first
# (via `cargo build --features grpc`, which runs `build.rs`, or via `buf
# generate`), and the resulting stubs MUST ship inside the package tarball:
# `proto/` is NOT included, so crates.io consumers — who have neither the
# protos nor protoc — need the pre-generated module to get a self-contained,
# compilable crate. This list is additive to Cargo's built-in defaults for a
# package with no `exclude`, so ordinary source/doc/license files are still
# included automatically.
include = [
  "src/**",
  "build.rs",
  "Cargo.toml",
  "README.md",
  "CONTRACT.md",
  "LICENSE",
]

[features]
default = ["rest", "grpc", "amqp", "opaque"]
# §12 OIDC/SSO relying-party helpers (`src/oidc/`) need a CSPRNG, SHA-256, and
# base64url for PKCE (`oidc_begin`) — CONTRACT.md §12.1 rules 1-3. No new
# runtime dependency is added for this: `getrandom` and `base64` are already
# unconditional TRANSITIVE dependencies whenever `rest` is enabled (`getrandom`
# via `uuid`'s `v4` feature; `base64` via `tonic`/header-parsing paths already
# in the graph), and `sha2` is already an optional dependency of this crate
# (previously wired only to `amqp`). This mirrors the existing `subtle`
# precedent below: promoting an already-vendored transitive crate to a named
# direct dependency for the code path that needs it adds no new supply-chain
# surface.
#
# `hmac`/`hex`/`subtle` are additionally required by the CONTRACT.md §13
# webhook signature verifier (`src/webhook.rs`): HMAC-SHA256 over the raw
# delivery body, hex-decoding of the `v1=` field, and a constant-time compare
# over the decoded MAC bytes. All three are already vendored — `hmac`/`hex` by
# the `amqp` feature below and `subtle` unconditionally via
# `jsonwebtoken` -> `ed25519-dalek` — so, exactly like `sha2`/`getrandom`/
# `base64` above, this only promotes an already-present crate to a named direct
# dependency for the code path that needs it. No new supply-chain surface.
rest = ["dep:reqwest", "dep:sha2", "dep:getrandom", "dep:base64", "dep:hmac", "dep:hex", "dep:subtle"]
# CONTRACT.md §23 OPAQUE (RFC 9807). Its own feature, and in `default`, because
# it is genuinely optional for a consumer: it is the only thing in this crate
# that pulls an elliptic-curve stack and an Argon2/scrypt implementation, and a
# size-conscious build that will never call `login_opaque` should not carry
# them. `--no-default-features --features rest` gets the §1-§22 surface with
# none of this. It implies `rest` because OPAQUE is a login path, not a
# transport.
#
# Note what this feature no longer pulls: `num-bigint`. §23.1 forbids an SDK
# from implementing OPAQUE, so the protocol comes from `axiam-opaque` — the
# same crate the AXIAM server links — and the ~870 lines of group arithmetic,
# RFC 5054 constants and hand-rolled PBKDF2 that SRP required are gone.
opaque = ["dep:axiam-opaque", "rest"]
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost"]
# `tracing` is a required (non-optional) dependency of `amqp`, not gated by
# `observability`: the CONTRACT.md §8.4 security-event log on HMAC
# verification failure is a mandatory correctness/security control (T-16-11),
# not optional diagnostic instrumentation, so it must always be emitted
# regardless of whether the crate-wide `observability` feature is enabled.
amqp = ["dep:lapin", "dep:hmac", "dep:sha2", "dep:hex", "dep:futures-util", "dep:tracing", "dep:chrono", "dep:subtle"]
observability = ["dep:tracing"]
# §10 middleware/route-guard: the Actix-Web `FromRequest` extractor
# (`AxiamUser`). Off by default so the core SDK does not pull actix-web
# unconditionally (D-02 modularity). Depends on `rest` for the shared
# `JwksVerifier` (broadened cfg gate in src/token/jwks.rs). Also pulls in
# `subtle` for the constant-time CSRF double-submit comparison (CSRF fix,
# see src/middleware/actix.rs) — `subtle` is already an unconditional
# transitive dependency via `jsonwebtoken` -> `ed25519-dalek`, so gating it
# here adds no new supply-chain surface; it only makes an already-vendored
# crate a direct dep for the code path that needs it.
actix = ["dep:actix-web", "dep:subtle", "rest"]
# §11 declarative authorization helpers: the `#[require_access]` /
# `#[require_auth]` / `#[require_role]` Actix-Web attribute macros, re-exported
# from `axiam_sdk` so users write `use axiam_sdk::require_access;`. Implies
# `actix` (the macros expand to the §10 `AxiamUser` extractor and the runtime
# guard in `middleware::authz`). The proc-macro crate is version-locked (`=`)
# to this crate: the expansion references `::axiam_sdk` runtime helpers, so the
# two must always ship together.
macros = ["dep:axiam-sdk-macros", "actix"]
# §22.14 declarative reactor handler binding: the `#[reactor_handler]` attribute
# macro, re-exported from `axiam_sdk` so users write
# `use axiam_sdk::reactor_handler;`. Implies `amqp` (the expansion names
# `::axiam_sdk::amqp::reactor` types), and deliberately NOT `macros`, which
# implies `actix`: a reactor is an AMQP daemon with no HTTP surface, so pulling
# actix-web in to get an attribute macro would be a dependency for nothing.
reactor-macros = ["dep:axiam-sdk-macros", "amqp"]

[dependencies]
axiam-sdk-macros = { version = "=1.0.0-alpha31", path = "axiam-sdk-macros", optional = true }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
# `form` (CONTRACT.md §12.1 note 1 — `POST /oauth2/token` etc. are
# `application/x-www-form-urlencoded`, RFC 6749 §4.1.3, never JSON) is added
# alongside the pre-existing `json`/`rustls`/`cookies` features for §12.
# reqwest is declared per-target below: the browser build cannot have
# `rustls` (the browser owns TLS) or `cookies` (the browser owns the jar).
# See the two `[target.'cfg(...)'.dependencies]` tables near the bottom.
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-native-roots"], optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
lapin = { version = "4", optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
hmac = { version = "0.13", optional = true }
sha2 = { version = "0.11", optional = true }
hex = { version = "0.4", optional = true }
# NEW-4 (v2 AMQP replay protection): `issued_at` is an RFC3339 UTC timestamp
# inside the signed body, parsed from the delivery's `serde_json::Value` for
# the freshness gate. `clock` brings in `Utc::now()`; `serde` is required for
# the `AuthzRequest`/`AuditEventMessage` DTO fields (mirrors the server's
# `chrono::DateTime<Utc>` field type in `crates/axiam-amqp/src/messages.rs`).
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"], optional = true }
# `default-features = false`: the SDK's §10/§11 code uses only `HttpRequest`
# (+ `req.cookie()` -> `cookies`), `web::Data`, `HttpResponse`, `Responder` and
# `ResponseError`. actix-web's default set additionally pulls its whole
# server-side response-compression stack (brotli + zstd + flate2), HTTP/2
# (h2 0.3, a second h2 major alongside the h2 0.4 tonic/reqwest already use),
# `encoding_rs`, `language-tags`, WebSockets, and the `unicode` router (full
# `regex` instead of `regex-lite`) — none of which this crate touches. On a cold
# `cargo build --all-features` those units alone were measured at ~63 s of
# compile work (zstd-sys 15.9 s, h2 0.3 15.7 s, brotli 8.1 s, regex-automata
# 7.6 s, encoding_rs 7.1 s, language-tags 5.1 s, regex-syntax 3.9 s).
#
# This does NOT take those features away from consumers: an application using
# the `actix`/`macros` features necessarily has its own `actix-web` dependency,
# and Cargo unifies features across the graph — whatever that application
# enables (compression, HTTP/2, WebSockets, …) is enabled for the whole build.
# It only stops THIS crate from forcing them on builds that never asked.
#
# `macros` is kept because this repository's own tests and the
# `actix_route_guard` example use `#[actix_web::test]` / `#[get]`.
actix-web = { version = "4", default-features = false, features = ["cookies", "macros"], optional = true }
# Constant-time comparison for the CSRF double-submit check in
# `middleware::actix::csrf_valid`. See the `actix` feature comment above for
# why this adds no new supply-chain surface.
subtle = { version = "2", optional = true }
# CSPRNG for §12.1 PKCE `state`/`nonce`/`code_verifier` generation
# (`src/oidc/authorize.rs`). Already an unconditional transitive dependency
# via `uuid`'s `v4` feature — see the `rest` feature comment above.
getrandom = { version = "0.4", optional = true }
# base64url (no padding) encoding for §12.1 PKCE — already an unconditional
# transitive dependency (via `tonic`); see the `rest` feature comment above.
base64 = { version = "0.23", optional = true }
# CONTRACT.md §23 OPAQUE (RFC 9807).
#
# Vendored under `vendor/axiam-opaque` rather than taken from crates.io because
# the crate is not published yet; see that directory's Cargo.toml. When it is
# published this becomes an ordinary version requirement and the vendored copy
# is deleted — no code changes either way.
#
# It is a path dependency to exactly one implementation on purpose. §23.1
# forbids an SDK from writing its own, because eleven independent
# implementations of an OPRF, hash_to_curve and a three-message AKE is the
# thing this design exists to avoid.
axiam-opaque = { path = "vendor/axiam-opaque", optional = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# `preserve_order` (SDK-Q01): backs `serde_json::Value`'s object map with an
# insertion-ordered `IndexMap` instead of the default alphabetical `BTreeMap`.
# The AMQP consumer verifies HMACs by parsing the delivery body into a `Value`
# and re-serializing it (minus `hmac_signature`); the server signs the SAME
# bytes it emitted from a concrete struct in FIELD-DECLARATION order (e.g.
# AuthzRequest: correlation_id, tenant_id, subject_id, action, resource_id,
# scope, key_version — NOT alphabetical). Without this feature `Value` would
# re-serialize alphabetically, so the SDK would HMAC over different bytes than
# the server signed and reject every genuine message. With it, `Value`
# preserves the order the keys arrived in — which, because the server emits
# declaration order on the wire, reproduces the exact signed bytes.
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
tracing = { version = "0.1", optional = true }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
tokio-test = "0.4"
# Additive dev-only feature: `router` unlocks `Server::add_service` for the
# in-process tonic test server (tests/grpc_check_access_test.rs, SC#4). Never
# enabled for the published library build — Cargo unifies dev-dependency
# features only for `cargo test`/`cargo build --tests`, not for downstream
# consumers of the published crate.
tonic = { version = "0.14", default-features = false, features = ["router", "gzip"] }
# `trybuild` drives the compile-fail UI tests for the §11 attribute macros
# (tests/ui/*.rs): asserts that macro misuse (missing `action`, conflicting
# resource selectors, non-async fn) fails to compile with a clear message.
trybuild = "1"
# `rcgen` generates a throwaway test CA + client certificate/key at TEST TIME
# for the §6.1 mTLS tests (tests/mtls_client_cert_test.rs). This keeps private
# keys OUT of the repository — nothing is committed; every key is minted in
# the test process and dropped when it ends.
rcgen = "0.14"
# §12 OIDC ID-token test fixtures (tests/oidc_*_test.rs) need distinct EdDSA
# signing keys to build "published"/"rogue"/"impostor" JWKS scenarios.
# `ed25519-dalek` is already an unconditional TRANSITIVE dev/runtime
# dependency (via `jsonwebtoken`'s `rust_crypto` backend), so this is the
# same "promote an already-vendored crate to a named dependency" pattern as
# `subtle`/`getrandom`/`base64` above — here scoped to `[dev-dependencies]`
# only, so it never reaches a published build at all.
ed25519-dalek = "3"

[package.metadata.docs.rs]
all-features = true

# ⚠ SCOPE OF THIS PROFILE — READ BEFORE ASSUMING IT HELPS CONSUMERS.
#
# Cargo applies the `[profile.*]` tables of the WORKSPACE ROOT of the build
# being run, and of nothing else. When `axiam-sdk` is a dependency, the root is
# the *consumer's* workspace, so everything below is **ignored** — the SDK
# compiles under whatever profile the consuming binary declares (by default
# `opt-level = 3`, `lto = false`, `codegen-units = 16`). A `[profile.*]` table
# in a dependency, or in a non-root workspace member, is silently discarded;
# cargo only prints "profiles for the non root package will be ignored" for the
# latter. (That warning is why the identical table was removed from
# `axiam-sdk-macros/Cargo.toml`.)
#
# So this table governs exactly two things: `cargo build --release` /
# `cargo bench` **inside this repository** (the examples, the benches, and the
# `cargo publish --dry-run` verification build). It is not, and cannot be, a
# performance setting shipped to users.
#
# Consumers who want whole-program LTO across the SDK must set it in their own
# top-level `Cargo.toml`; see "Release-profile tuning (for consumers)" in
# README.md for the copy-pasteable block.
[profile.release]
opt-level = 3         # Maximum optimization for speed.
lto = "fat"           # Whole-program LTO across all crates (== `true`); best
                      # runtime throughput, slowest link.
codegen-units = 1     # One codegen unit per crate — lets the optimizer see the
                      # whole crate at the cost of parallelism during compile.
strip = "symbols"     # Drop the symbol table to shrink the shipped binary. No
                      # runtime cost (release already builds with debug = 0).

# Five per-capability examples (D-08) — the §1-§10 conformance demonstration
# referenced by the README. Each declares only the feature(s) it actually
# exercises so `cargo build --examples --features <subset>` only compiles
# the examples relevant to that subset.
[[example]]
name = "login_mfa"
required-features = ["rest"]

# CONTRACT.md §23 OPAQUE demonstration.
[[example]]
name = "opaque_login"
required-features = ["opaque"]

# CONTRACT.md §12 OIDC/SSO relying-party helpers demonstration.
[[example]]
name = "oidc_login"
required-features = ["rest"]

[[example]]
name = "rest_check_access"
required-features = ["rest"]

[[example]]
name = "grpc_check_access"
required-features = ["rest", "grpc"]

[[example]]
name = "amqp_consumer"
required-features = ["amqp"]

# CONTRACT.md §22 reactor runtime demonstration. A directory example
# (`examples/reactor/main.rs`) rather than a single file, because it is the one
# example with enough structure to be worth reading in parts.
[[example]]
name = "reactor"
path = "examples/reactor/main.rs"
# `reactor-macros` rather than `amqp`: the example binds its three handlers with
# §22.14's `#[reactor_handler]`, which is what a reactor should look like.
required-features = ["reactor-macros"]

[[example]]
name = "actix_route_guard"
required-features = ["actix", "macros"]

# Hot-path micro-benchmark (`harness = false`, no criterion/divan dependency —
# see the file's module docs for why). Measures `JwksVerifier::verify`, the one
# SDK code path the §10/§11 route guard runs per inbound request.
[[bench]]
name = "jwks_verify"
harness = false
required-features = ["rest"]

[[example]]
name = "uma_resource_server"
required-features = ["rest", "actix"]

[[example]]
name = "uma_client"
required-features = ["rest"]

# ---------------------------------------------------------------------------
# Target-gated dependencies (browser vs everything else)
# ---------------------------------------------------------------------------
#
# The `axiam-sdk-wasm` npm package compiles THIS crate to
# `wasm32-unknown-unknown`. Three things differ there and cannot be papered
# over with a feature flag, because they are properties of the platform rather
# than choices:
#
#   * TLS belongs to the browser. `rustls` has no socket to configure, and a
#     custom CA or a client certificate cannot be presented from page script at
#     all — `with_custom_ca` and `with_client_cert` therefore return a typed
#     error on wasm rather than silently doing nothing (see src/client.rs).
#   * Cookies belong to the browser. reqwest's `cookies` feature drives a
#     process-local jar that a `fetch` call would ignore; the browser attaches
#     them itself once the request is made with `credentials: include`.
#   * Timeouts and redirect policy are not configurable through `fetch`.
#
# Everything else — the REST surface, §12 OIDC helpers, JWKS verification, the
# decision memo, §23 SRP — is portable and shared.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "cookies", "form"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# No `rustls`, no `cookies`: see above. `json` and `form` are the two body
# encodings the REST and OIDC surfaces use, and both work over `fetch`.
reqwest = { version = "0.13", default-features = false, features = ["json", "form"], optional = true }
# `Instant`/`SystemTime` panic on wasm32-unknown-unknown — std has no clock
# there and chose to abort rather than lie. `web-time` backs them with
# `performance.now()`/`Date.now()`. See src/time.rs.
web-time = "1"
# `getrandom` reaches the platform CSPRNG through `crypto.getRandomValues` only
# with this feature; without it a wasm build fails to link. Used by PKCE state
# generation (§12.1) and SRP client ephemerals (§23).
getrandom = { version = "0.4", features = ["wasm_js"] }
# uuid's v4 needs the same JS entropy source.
uuid = { version = "1", features = ["serde", "v4", "js"] }
# `jsonwebtoken` still depends on getrandom 0.2 (via p256/p384 -> elliptic-curve
# -> rand_core 0.6), which is a separate crate from the 0.4 above and needs its
# OWN wasm opt-in — a different one, spelled `js` rather than `wasm_js`. Named
# here purely so feature unification turns it on; nothing in this crate calls
# it directly. Without it the build fails inside getrandom with "the
# wasm*-unknown-unknown targets are not supported by default".
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
